<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Berita Sekolah</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header fade-in">
  <div class="header-left">
    <img src="logo.jpg" class="logo">
    <div>
      <h1>SDN KARAWANG WETAN IV</h1>
      <p>Sekolah Dasar Negeri</p>
    </div>
  </div>
</header>

<nav class="navbar fade-in">
  <a href="index.html">Beranda</a>
  <a href="profil.html">Profil</a>
  <a href="berita.html">Berita</a>
  <a href="galeri.html">Galeri</a>
</nav>

<section class="hero fade-in">
  <h2>Berita Sekolah</h2>
</section>

<main class="container">
<section class="content fade-in" id="berita-list"></section>
</main>

<footer class="footer fade-in">
  <p>© 2026 SDN KARAWANG WETAN IV</p>
</footer>

<script>
const berita = [
  {
    judul: "Upacara Bendera",
    tanggal: "15 Januari 2026",
    isi: "Upacara berlangsung khidmat."
  },
  {
    judul: "Literasi Pagi",
    tanggal: "10 Januari 2026",
    isi: "Membaca sebelum belajar."
  }
];

const container = document.getElementById("berita-list");
container.innerHTML = berita.map(b => `
  <article class="post fade-in">
    <h4>${b.judul}</h4>
    <small>${b.tanggal}</small>
    <p>${b.isi}</p>
  </article>
`).join("");
</script>

</body>
</html>
